name: Shot
options:
  bundleIdPrefix: com.jinzhuming
  createIntermediateGroups: true
  developmentLanguage: zh-Hans
  knownRegions:
    - zh-Hans
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
targets:
  ShotKit:
    type: framework
    platform: macOS
    sources:
      - path: Sources/ShotKit
    settings:
      base:
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        GENERATE_INFOPLIST_FILE: true
  Shot:
    type: application
    platform: macOS
    sources:
      - path: Sources/Shot
      - path: Support/Assets.xcassets
        buildPhase: resources
      - path: Support/Shot.icns
        buildPhase: resources
    resources:
      - path: Sources/Shot/Localizable.xcstrings
      - path: Sources/Shot/PrivacyInfo.xcprivacy
    configFiles:
      Debug: Support/Shot.xcconfig
      Release: Support/Shot.xcconfig
    entitlements:
      path: Shot.entitlements
      properties:
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_NAME: Shot
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: Support/Info.plist
        CODE_SIGN_ENTITLEMENTS: Shot.entitlements
        DEVELOPMENT_TEAM: 68972XHMZQ
        ENABLE_HARDENED_RUNTIME: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        COMBINE_HIDPI_IMAGES: "YES"
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "-"
        Release:
          CODE_SIGN_IDENTITY: "Developer ID Application"
    dependencies:
      - target: ShotKit
