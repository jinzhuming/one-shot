name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Run Swift tests
        run: swift test

      - name: Validate localization
        run: make validate-localization

      - name: Regenerate and validate Xcode project
        run: make generate
